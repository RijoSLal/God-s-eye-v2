browser:
  extra_args:
    - "--disable-gpu"
    - "--disable-dev-shm-usage"
    - "--no-sandbox"
    - "--single-process"
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

settings:
  model: "qwen3:4b-instruct"
  base_url: "https://nonsubtractive-raye-peptidolytic.ngrok-free.dev/v1"
  temperature: 0.5
  api_key: "password"

search:
  host: "http://searxng:8080"
  url_ceil_surface: 5
  url_ceil_deep: 9
  bm25_threshold: 1.15
  queries:
    - "site:stackoverflow.com {query}"
    - "site:github.com {query}"
    - "site:developer.mozilla.org OR site:docs.python.org {query}"
    - "site:exploit-db.com {query}"
    - "site:book.hacktricks.xyz {query}"
    - "site:nvd.nist.gov OR site:cvedetails.com {query}"
    - "{query}"

crawler:
  page_timeout:
    surface: 5000
    deep: 8000
  selectors:
    deep: "article, .entry-content, .post-content, .article-body, main, .code, pre, code, .documentation, .docs"
  excluded_tags:
    - "nav"
    - "footer"
    - "header"
    - "aside"
    - "script"
    - "style"
    - "noscript"
  markdown_options:
    ignore_links: true
    ignore_images: true
    body_width: 0

ssh:
  host: "ec2-54-221-157-174.compute-1.amazonaws.com"
  user: "kali"
  key_path: "config/kali_instance.pem"

terminal:
  prefix: "rtk"

tools:
  web_search:
    name: "web_search"
    description: "Call this tool to retrieve external information from the web. Use this tool when requested data is not present in internal knowledge."
  terminal:
    name: "terminal"
    description: "Execute a shell command."

# ssh -i "kali_instance.pem" admin@ec2-50-19-76-184.compute-1.amazonaws.com 

condense:
  system: |
    ROLE: Data Aggregator.
    TASK: Summarize the provided search outputs.
  basic: |
    TASK: Answer the provided query using exclusively the provided search results. Output the answer directly without conversational text.
    QUERY: {query}
    SEARCH RESULTS: {context}
  technical: |
    TASK: Produce a technical summary of the provided topic using exclusively the provided search results.
    TOPIC: {query}
    SEARCH RESULTS: {context}
